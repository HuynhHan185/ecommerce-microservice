syntax = "proto3";
package shipment;

service ShipmentService {
  rpc GetShipment (GetShipmentRequest) returns (Shipment);
  rpc GetShipmentByOrder (GetByOrderRequest) returns (Shipment);
  rpc UpdateStatus (UpdateStatusRequest) returns (Shipment);
}

message GetShipmentRequest { int32 shipid = 1; string requester_uid = 2; bool can_view_all = 3; }
message GetByOrderRequest { int32 oid = 1; string requester_uid = 2; bool can_view_all = 3; }
message UpdateStatusRequest { int32 shipid = 1; string status = 2; }
message Shipment { int32 shipid = 1; int32 oid = 2; string status = 3; }
