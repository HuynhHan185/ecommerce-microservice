syntax = "proto3";
package auth;

service AuthService {
  rpc Register (RegisterRequest) returns (RegisterReply);
  rpc Login (LoginRequest) returns (LoginReply);
  rpc Verify (VerifyRequest) returns (VerifyReply);
}

message RegisterRequest { string username = 1; string email = 2; string phone = 3; string password = 4; }
message RegisterReply { string user_id = 1; string username = 2; string role = 3; }
message LoginRequest { string username = 1; string password = 2; }
message LoginReply { string access_token = 1; int32 expires_in = 2; string role = 3; }
message VerifyRequest { string token = 1; }
message VerifyReply { bool valid = 1; string user_id = 2; string role = 3; int64 exp = 4; }
